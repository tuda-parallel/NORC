[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { }

[project]
name = "norc"
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = [
  "numpy~=1.24",
  "matplotlib~=3.7",
  "PySide6~=6.6",
  "termcolor~=2.4",
  "pycubexr~=2.0,!=2.0.0",
  "tqdm~=4.67",
  "scipy~=1.17"
]
authors = [
    { name = "Lukas Fuchs", email = "lukas.fuchs@stud.tu-darmstadt.de" },
    { name = "Ahmad Tarraf", email = "ahmad.tarraf@tu-darmstadt.de" },
    { name = "Alexander Geiß", email = "alexander.geiss1@tu-darmstadt.de" }
    ]
maintainers = [
    { name = "Lukas Fuchs", email = "lukas.fuchs@stud.tu-darmstadt.de" },
    { name = "Ahmad Tarraf", email = "ahmad.tarraf@tu-darmstadt.de" },
    { name = "Alexander Geiß", email = "alexander.geiss1@tu-darmstadt.de" }
]
description = "Noise Resilient Hardware Counters in HPC"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["hardware counter", "noise", "HPC"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Homepage = "https://github.com/tuda-parallel/NORC"
Documentation = "https://github.com/tuda-parallel/NORC/docs"
Repository = "https://github.com/tuda-parallel/NORC"
"Bug Tracker" = "https://github.com/tuda-parallel/NORC/issues"
Changelog = "https://github.com/tuda-parallel/NORC/blob/master/CHANGELOG.md"


[project.scripts]
# Standard Scripts (always available)
norc_gui = "norc.analysis_ui:main"
norc_analyze = "norc.core.analyze:main"
norc_plot = "norc.core.plot_rel_dev:main"
norc_rank = "norc.core.score:main"
norc_generate = "norc.core.generate:main"
norc_calc_time = "norc.core.calc_time:main"
norc_redundancy = "norc.core.redundancy:main"


[project.optional-dependencies]
# external-libs = [
#     "fastdtw",
#     "dash",
#     "dash_extensions",
#     "plotly_resampler",
#     "trace_updater",
#     "flask",
# ]

development-libs = [
    "ruff",
    "nbstripout",
    "pytest",
]

[project.gui-scripts]


[tool.setuptools.dynamic]
version = { attr = "norc.__version__" }
readme = { file = ["README.md"] }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
# Set the maximum line length to 90.
line-length = 90
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "env",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`, `W`), isort (`I`), 
# flake8-bugbear (`B`), flake8-comprehensions (`C4`), 
# pyupgrade (`UP`), and flake8-simplify (`SIM`).
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]

# List of rules to ignore
ignore = [
    "E501", # Line too long (formatter will handle this)
    "E203", # Whitespace before ':' (Black compatibility)
    "B008", # Do not perform function calls in argument defaults
    "F403", # Star imports (from module import *)
    "F405", # Star imports (undefined or defined from star imports)
    "E722", # Do not use bare `except`
    "UP031", # Use f-string instead of % formatting
    "SIM108", # Use ternary operator instead of `if`-`else`-block (ignored for readability)
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM113", # Use `enumerate` for index in `for` loops
    "SIM115", # Use a context manager for opening files
    "SIM101", # Use `a in (b, c)` instead of `a == b or a == c`
    "SIM116", # Use a dictionary lookup instead of an `if`-`elif`-`else` chain
    "F821", # Undefined name
    "F811", # Redefinition of unused name
    "B007", # Loop control variable not used within loop body
    "E741", # Ambiguous variable name
    "E402", # Module level import not at top of file
]

[tool.ruff.lint.isort]
# Treat the following as a first-party module.
known-first-party = ["norc"]
